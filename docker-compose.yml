services:
  app:
    build: .
    image: langnghe:latest
    container_name: langnghe
    restart: unless-stopped
    # BẮT BUỘC: trên máy này `ubuntu` là uid=1001 gid=33(www-data), không phải
    # 1000:1000. Chạy sai uid thì container không ghi được vào mp3/.
    user: "1001:33"
    # Chỉ bind vào loopback: cloudflared chạy host network nên với tới được,
    # còn Internet thì không. Đây cũng là điều kiện để tin header CF-Connecting-IP.
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    volumes:
      - ./mp3:/app/mp3
    env_file:
      - .env
    # KHÔNG thêm `security_opt: no-new-privileges:true` trên host này.
    # Host bật AppArmor, Docker áp profile `docker-default` cần chuyển profile
    # lúc exec, mà no_new_privs chặn đúng việc chuyển đó -> mọi binary trong
    # container đều lỗi "exec ...: operation not permitted", kể cả python.
    # Container vẫn được bảo vệ bằng: profile AppArmor mặc định, chạy non-root,
    # và chỉ bind vào loopback.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
